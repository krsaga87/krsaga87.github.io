<h1>Personvern</h1>
<p>hjemme-backup er et privat verktøy som bare brukes av eieren. Det leser eierens egne data i Google Disk og Gmail med lesetilgang og lagrer en kryptert kopi på eierens egen maskin. Ingen data deles med andre, og ingen andre brukere har tilgang.</p>
